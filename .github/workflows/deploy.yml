name: Deploy to GitHub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build for all platforms
        run: |
          # Build for Linux
          GOOS=linux GOARCH=amd64 go build -o git-ai-commit-linux-amd64 .
          chmod +x git-ai-commit-linux-amd64

          # Build for Windows
          GOOS=windows GOARCH=amd64 go build -o git-ai-commit-windows-amd64.exe .

          # Build for macOS
          GOOS=darwin GOARCH=amd64 go build -o git-ai-commit-darwin-amd64 .
          chmod +x git-ai-commit-darwin-amd64

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./git-ai-commit-linux-amd64
          asset_name: git-ai-commit-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./git-ai-commit-windows-amd64.exe
          asset_name: git-ai-commit-windows-amd64.exe
          asset_content_type: application/octet-stream

      - name: Upload macOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./git-ai-commit-darwin-amd64
          asset_name: git-ai-commit-darwin-amd64
          asset_content_type: application/octet-stream
