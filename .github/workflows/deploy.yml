name: Deploy to GitHub

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for Go file changes
        id: changed-go-files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**.go'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build for all platforms
        run: |
          # Build for Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -buildvcs=false" -trimpath -o git-ai-commit-linux-amd64 .
          chmod +x git-ai-commit-linux-amd64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -buildvcs=false" -trimpath -o git-ai-commit-linux-arm64 .
          chmod +x git-ai-commit-linux-arm64

          # Build for Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -buildvcs=false" -trimpath -o git-ai-commit-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -buildvcs=false" -trimpath -o git-ai-commit-windows-arm64.exe .

          # Build for macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -buildvcs=false" -trimpath -o git-ai-commit-darwin-amd64 .
          chmod +x git-ai-commit-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -buildvcs=false" -trimpath -o git-ai-commit-darwin-arm64 .
          chmod +x git-ai-commit-darwin-arm64
        if: steps.changed-go-files.outputs.go == 'true'

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          delete_old_releases: true
          files: |
            ./git-ai-commit-linux-amd64
            ./git-ai-commit-linux-arm64
            ./git-ai-commit-windows-amd64.exe
            ./git-ai-commit-windows-arm64.exe
            ./git-ai-commit-darwin-amd64
            ./git-ai-commit-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changed-go-files.outputs.go == 'true'
